version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vectracite-api
    ports:
      - "8080:8080"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - qdrant
      - redis
      - mlflow
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vectracite-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: vectracite-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: vectracite-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
