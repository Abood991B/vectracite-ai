[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectracite-ai"
version = "1.0.0"
description = "Enterprise Multimodal Document Intelligence, Hybrid RAG & QLoRA/vLLM Inference Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Abdulrahman Baidaq", email = "abdulrahman16baidaq@gmail.com" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
