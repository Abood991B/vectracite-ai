apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectracite-ai-api
  labels:
    app: vectracite-ai
    component: rag-inference-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vectracite-ai
  template:
    metadata:
      labels:
        app: vectracite-ai
    spec:
      containers:
        - name: api
          image: ghcr.io/abood991b/vectracite-ai:latest
          ports:
            - containerPort: 8080
          env:
            - name: QDRANT_HOST
              value: "qdrant-service"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: vectracite-ai-service
spec:
  type: LoadBalancer
  selector:
    app: vectracite-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vectracite-ai-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vectracite-ai-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
