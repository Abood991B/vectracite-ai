apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectracite-ai-api
  labels:
    app: vectracite-ai
    component: rag-inference-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vectracite-ai
  template:
    metadata:
      labels:
        app: vectracite-ai
    spec:
      containers:
        - name: api
          image: ghcr.io/abood991b/vectracite-ai:latest
          ports:
            - containerPort: 8080
          env:
            - name: QDRANT_HOST
              value: "qdrant-service"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_IN_MEMORY
              value: "false"
            - name: ALLOW_QDRANT_FALLBACK
              value: "false"
            - name: INDEX_SYNC_SECONDS
              value: "15"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
            - name: REQUIRE_REDIS
              value: "true"
            - name: MUTATION_LEASE_TTL_SECONDS
              value: "300"
            - name: MUTATION_LEASE_ACQUIRE_TIMEOUT_SECONDS
              value: "30"
            - name: AUTH_REQUIRED
              value: "true"
            - name: API_READ_KEY
              valueFrom:
                secretKeyRef:
                  name: vectracite-api-credentials
                  key: read-key
            - name: API_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: vectracite-api-credentials
                  key: admin-key
            - name: CORS_ALLOWED_ORIGINS
              value: "https://vectracite.example.com"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: vectracite-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vectracite-uploads
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vectracite-ai-service
spec:
  type: ClusterIP
  selector:
    app: vectracite-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vectracite-ai-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vectracite-ai-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
